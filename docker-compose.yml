services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parqueo
      POSTGRES_USER: parqueo
      POSTGRES_PASSWORD: parqueo
    ports:
      - "5433:5432"   # 5433 en tu PC (el 5432 lo usa el PostgreSQL local de Windows)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parqueo -d parqueo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visor web de la base de datos: http://localhost:8081
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/parqueo
      DB_USER: parqueo
      DB_PASSWORD: parqueo
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
