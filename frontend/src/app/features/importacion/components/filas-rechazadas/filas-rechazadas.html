<div class="tarjeta">
  <h2>Rechazadas ({{ filas().length }})</h2>
  <table>
    <thead>
      <tr>
        <th>Fila</th>
        <th>Ticket</th>
        <th>Código</th>
        <th>Motivo</th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.fila) {
        <tr>
          <td>{{ fila.fila }}</td>
          <td>{{ fila.ticket }}</td>
          <td><span class="etiqueta etiqueta-error">{{ fila.codigo }}</span></td>
          <td>{{ fila.motivo }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="vacio">Ninguna fila rechazada</td>
        </tr>
      }
    </tbody>
  </table>
</div>
