<div class="tarjeta">
  <h2>Aceptadas ({{ filas().length }})</h2>
  <table>
    <thead>
      <tr>
        <th>Fila</th>
        <th>Ticket</th>
        <th class="monto">Total</th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.fila) {
        <tr>
          <td>{{ fila.fila }}</td>
          <td>{{ fila.ticket }}</td>
          <td class="monto">{{ fila.total_centimos | soles }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="vacio">Ninguna fila aceptada</td>
        </tr>
      }
    </tbody>
  </table>
</div>
